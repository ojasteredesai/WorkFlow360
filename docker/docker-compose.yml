version: "3.9"

services:
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - workflow360-postgres-data:/var/lib/postgresql/data
    networks:
      - workflow360-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    image: ${USER_SERVICE_IMAGE}
    container_name: user-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - workflow360-net

  timecard-service:
    image: ${TIMECARD_SERVICE_IMAGE}
    container_name: timecard-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8081:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - workflow360-net
  expense-service:
    image: ${EXPENSE_SERVICE_IMAGE}
    container_name: expense-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8082:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - workflow360-net
  
  invoice-service:
    image: ${INVOICE_SERVICE_IMAGE}
    container_name: invoice-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8083:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - workflow360-net

  vms-service:
    image: ${VMS_SERVICE_IMAGE}
    container_name: vms-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8084:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - workflow360-net

volumes:
  workflow360-postgres-data:
    external: true
    name: docker-workflow360-postgres-data

networks:
  workflow360-net:
    driver: bridge