apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: workflow360
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672   # AMQP
            - containerPort: 15672  # Management UI
          envFrom:
            - secretRef:
                name: rabbitmq-secret