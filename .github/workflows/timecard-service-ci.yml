name: TimecardServiceCI

on:
  push:
    branches:
      - main
    paths:
      - "services/timecard-service/**"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ojasteredesai/timecard-service:${{ github.sha }} \
            services/timecard-service

      - name: Push Docker image
        run: |
          docker push ojasteredesai/timecard-service:${{ github.sha }}
          
