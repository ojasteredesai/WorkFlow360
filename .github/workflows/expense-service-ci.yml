name: VMS Service – CI

on:
  push:
    paths:
      - "services/vms-service/**"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image (CI validation only)
        run: |
          docker build \
            -t vms-service-ci:${{ github.sha }} \
            services/vms-service
