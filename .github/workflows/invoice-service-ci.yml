name: Invoice Service – CI

on:
  push:
    paths:
      - "services/invoice-service/**"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image (CI validation only)
        run: |
          docker build \
            -t invoice-service-ci:${{ github.sha }} \
            services/invoice-service